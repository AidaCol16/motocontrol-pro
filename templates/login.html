<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MotoControl Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            /* Mantenemos la imagen que te gustó */
            background: url("https://images.unsplash.com/photo-1558981806-ec527fa84c39?q=80&w=2070&auto=format&fit=crop") no-repeat center center fixed;
            background-size: cover;
            display: flex; 
            align-items: center; 
            /* CAMBIO: justify-content centrado para que no esté a la derecha */
            justify-content: center; 
            height: 100vh; 
            margin: 0;
        }
        
        .login-card { 
            width: 100%; 
            max-width: 400px; 
            padding: 40px; 
            border-radius: 20px; 
            /* Fondo blanco con transparencia equilibrada */
            background: rgba(255, 255, 255, 0.88); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
            border: 1px solid rgba(255, 255, 255, 0.3);
            /* CAMBIO: margen para asegurar el centrado en móviles */
            margin: 20px;
        }

        .brand-logo {
            font-size: 3rem;
            color: #212529;
            margin-bottom: 15px;
        }

        .form-control:focus {
            border-color: #212529;
            box-shadow: 0 0 0 0.25rem rgba(33, 37, 41, 0.1);
        }

        .btn-dark {
            transition: all 0.3s ease;
        }

        .btn-dark:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <div class="brand-logo">
            <i class="fas fa-motorcycle"></i>
        </div>
        <h3 class="fw-bold">MotoControl Pro</h3>
        <p class="text-muted mb-4">Gestión de Inventario y Pedidos</p>
        
        <form action="/login" method="POST">
            <div class="mb-3 text-start">
                <label class="form-label fw-semibold small">Usuario</label>
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" name="username" class="form-control border-start-0" placeholder="Nombre de usuario" required autofocus>
                </div>
            </div>
            
            <div class="mb-4 text-start">
                <label class="form-label fw-semibold small">Contraseña</label>
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-dark w-100 py-2 fw-bold shadow">
                <i class="fas fa-sign-in-alt me-2"></i>Ingresar al Sistema
            </button>
        </form>
        
        {% if error %}
        <div class="alert alert-danger mt-3 d-flex align-items-center border-0 shadow-sm" role="alert" style="background: rgba(248, 215, 218, 0.9);">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <div class="small fw-bold">{{ error }}</div>
        </div>
        {% endif %}
    </div>

</body>
</html>
