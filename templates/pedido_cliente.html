{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
            <h3 class="mb-0"><i class="fas fa-file-invoice-dollar me-2"></i>Tomar Nuevo Pedido</h3>
            <a href="/lista_pedidos" class="btn btn-dark btn-sm"><i class="fas fa-list-ul me-1"></i>Ver Pedidos</a>
        </div>
        <div class="card-body">
            <form id="formPedido" class="row g-3">
                <div class="col-md-7 position-relative">
                    <label class="form-label fw-bold">Producto (ID, Nombre o Marca):</label>
                    <input type="text" id="busqueda_p" class="form-control" placeholder="Busque el repuesto..." autocomplete="off" required>
                    <ul id="lista_p" class="list-group position-absolute w-100 shadow" style="z-index:1000; display:none; max-height: 240px; overflow-y: auto;"></ul>
                    <input type="hidden" name="id_p" id="id_p_final">
                    <div id="info_stock" class="form-text fw-bold mt-1"></div>
                </div>

                <div class="col-md-5">
                    <label class="form-label fw-bold">Cantidad a Pedir:</label>
                    <input type="number" name="cant" id="cant_input" class="form-control" min="1" required>
                </div>

                <hr>

                <div class="col-md-4 position-relative">
                    <label class="form-label fw-bold">RIF/Cédula Cliente:</label>
                    <input type="text" id="busqueda_cli_rif" name="cliente_rif" class="form-control text-uppercase" placeholder="V-12345678" autocomplete="off" required>
                    <ul id="lista_cli" class="list-group position-absolute w-100 shadow" style="z-index:1000; display:none; max-height: 200px; overflow-y: auto;"></ul>
                </div>

                <div class="col-md-8">
                    <label class="form-label fw-bold">Nombre o Razón Social:</label>
                    <input type="text" id="cliente_nombre" name="cliente" class="form-control text-uppercase" placeholder="Nombre completo del cliente" required>
                </div>

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-warning w-100 btn-lg fw-bold">
                        <i class="fas fa-save me-2"></i>Guardar Pedido en Borrador (Reservar Stock)
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
let stockDisponibleSeleccionado = null;

// --- 1. Lógica de búsqueda de Productos (Sugerencias con Stock Disponible) ---
document.getElementById('busqueda_p').addEventListener('input', function() {
    let q = this.value;
    let lista = document.getElementById('lista_p');
    document.getElementById('id_p_final').value = '';
    stockDisponibleSeleccionado = null;
    if(q.length < 1) { lista.style.display='none'; document.getElementById('info_stock').innerHTML=''; return; }
    
    fetch(`/api/buscar_producto_smart/${encodeURIComponent(q)}`).then(res => res.json()).then(data => {
        lista.innerHTML = '';
        if(data.encontrado) {
            data.resultados.forEach(p => {
                let li = document.createElement('li');
                let badgeClass = p.disponible > 5 ? 'bg-success' : (p.disponible > 0 ? 'bg-warning text-dark' : 'bg-danger');
                li.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';
                li.innerHTML = `
                    <span><strong>#${p.id_repuesto} - ${p.descripcion}</strong> <small class="text-muted">(${p.marca})</small></span>
                    <span class="badge ${badgeClass}">Disp: ${p.disponible}</span>
                `;
                li.style.cursor = 'pointer';
                li.onclick = () => {
                    document.getElementById('id_p_final').value = p.id_repuesto;
                    document.getElementById('busqueda_p').value = `${p.id_repuesto} | ${p.descripcion} (${p.marca})`;
                    document.getElementById('cant_input').max = p.disponible;
                    stockDisponibleSeleccionado = p.disponible;
                    if (p.disponible > 0) {
                        document.getElementById('info_stock').innerHTML = `<span class="text-success">✅ Stock disponible para reservar: ${p.disponible} unidad(es)</span>`;
                    } else {
                        document.getElementById('info_stock').innerHTML = `<span class="text-danger">❌ Producto agotado (0 disponibles)</span>`;
                    }
                    lista.style.display = 'none';
                };
                lista.appendChild(li);
            });
            lista.style.display = 'block';
        } else {
            lista.style.display = 'none';
        }
    });
});

// --- 2. Lógica de búsqueda de Clientes (Sugerencias mientras escribes) ---
document.getElementById('busqueda_cli_rif').addEventListener('input', function() {
    let q = this.value;
    let lista = document.getElementById('lista_cli');
    
    if(q.length < 1) { 
        lista.style.display='none'; 
        return; 
    }
    
    fetch(`/api/buscar_cliente_smart/${encodeURIComponent(q)}`).then(res => res.json()).then(data => {
        lista.innerHTML = '';
        if(data.encontrado) {
            data.resultados.forEach(c => {
                let li = document.createElement('li');
                li.className = 'list-group-item list-group-item-action';
                li.innerHTML = `<strong>${c.id_proveedor}</strong> - ${c.nombre_empresa}`;
                li.style.cursor = 'pointer';
                li.onclick = () => {
                    document.getElementById('busqueda_cli_rif').value = c.id_proveedor;
                    document.getElementById('cliente_nombre').value = c.nombre_empresa;
                    lista.style.display = 'none';
                };
                lista.appendChild(li);
            });
            lista.style.display = 'block';
        } else {
            lista.style.display = 'none';
        }
    });
});

// --- 3. Autocompletado al salir del campo RIF ---
['blur', 'change'].forEach(evento => {
    document.getElementById('busqueda_cli_rif').addEventListener(evento, function() {
        let rif = this.value.trim();
        let campoNombre = document.getElementById('cliente_nombre');
        
        if (rif.length > 0) {
            fetch(`/api/buscar_cliente_smart/${encodeURIComponent(rif)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.encontrado) {
                        let coincidencia = data.resultados.find(c => 
                            c.id_proveedor.toString().toUpperCase() === rif.toUpperCase()
                        );
                        if (coincidencia) {
                            campoNombre.value = coincidencia.nombre_empresa;
                        }
                    }
                })
                .catch(err => console.error('Error al recuperar datos del cliente:', err));
        }
    });
});

// --- 4. Envío del Pedido ---
document.getElementById('formPedido').addEventListener('submit', function(e) {
    e.preventDefault();
    if (!document.getElementById('id_p_final').value) {
        alert("Por favor selecciona un repuesto válido de la lista desplegable.");
        return;
    }
    let cant = parseInt(document.getElementById('cant_input').value || "0", 10);
    if (stockDisponibleSeleccionado !== null && cant > stockDisponibleSeleccionado) {
        alert(`No puedes pedir ${cant} unidades. Solo hay ${stockDisponibleSeleccionado} disponible(s).`);
        return;
    }
    fetch('/pedido_cliente', { method: 'POST', body: new FormData(this) })
    .then(res => res.json()).then(data => {
        alert(data.mensaje);
        if(data.exito) window.location.href = '/lista_pedidos';
    });
});

document.addEventListener('click', function(e) {
    if (!e.target.closest('.position-relative')) {
        document.getElementById('lista_p').style.display = 'none';
        document.getElementById('lista_cli').style.display = 'none';
    }
});
</script>
{% endblock %}
